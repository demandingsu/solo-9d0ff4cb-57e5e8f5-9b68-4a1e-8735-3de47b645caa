services:
  frequency-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gsb-frequency-api:latest
    container_name: gsb-frequency-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/frequency.db
    volumes:
      - frequency-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  frequency-data:
